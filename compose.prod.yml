name: maolao-image-studio

services:
  backend:
    image: ${BACKEND_IMAGE:-ghcr.io/linyeegiong/maolao-image-studio-backend:latest}
    pull_policy: always
    restart: unless-stopped
    env_file:
      - .env
    environment:
      MAOLAO_BASE_URL: ${MAOLAO_BASE_URL:-https://maolaoapi.com}
      DATA_DIR: /data
      MAOLAO_API_KEY: ${MAOLAO_API_KEY:?Set MAOLAO_API_KEY in .env}
      COS_ENABLED: ${COS_ENABLED:-false}
      COS_SECRET_ID: ${COS_SECRET_ID:-}
      COS_SECRET_KEY: ${COS_SECRET_KEY:-}
      COS_BUCKET: ${COS_BUCKET:-huajing-1437302460}
      COS_REGION: ${COS_REGION:-ap-guangzhou}
      COS_ENDPOINT: ${COS_ENDPOINT:-https://huajing-1437302460.cos.ap-guangzhou.myqcloud.com}
      COS_SIGNED_URL_TTL: ${COS_SIGNED_URL_TTL:-3600}
      COS_OBJECT_PREFIX: ${COS_OBJECT_PREFIX:-maolao}
    expose:
      - "8000"
    volumes:
      - maolao_data:/data
    dns:
      - 1.1.1.1
      - 8.8.8.8

  frontend:
    image: ${FRONTEND_IMAGE:-ghcr.io/linyeegiong/maolao-image-studio-frontend:latest}
    pull_policy: always
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "${APP_HOST:-127.0.0.1}:${APP_PORT:-7820}:80"

volumes:
  maolao_data:
