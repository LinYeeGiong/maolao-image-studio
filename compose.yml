name: maolao-image-studio

services:
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - maolao_redis:/data

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    env_file:
      - .env
    environment:
      MAOLAO_BASE_URL: ${MAOLAO_BASE_URL:-https://maolaoapi.com}
      DATA_DIR: /data
      MAOLAO_API_KEY: ${MAOLAO_API_KEY:-}
      MAOLAO_IMAGE_MODEL: ${MAOLAO_IMAGE_MODEL:-gpt-image-2-4k}
      RELAYROUTER_BASE_URL: ${RELAYROUTER_BASE_URL:-https://relayrouter.io/v1}
      RELAYROUTER_API_KEY: ${RELAYROUTER_API_KEY:-}
      RELAYROUTER_IMAGE_MODEL: ${RELAYROUTER_IMAGE_MODEL:-gpt-image-2}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-https://api.openai.com/v1}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_IMAGE_MODEL: ${OPENAI_IMAGE_MODEL:-gpt-image-2}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      COS_ENABLED: ${COS_ENABLED:-false}
      COS_SECRET_ID: ${COS_SECRET_ID:-}
      COS_SECRET_KEY: ${COS_SECRET_KEY:-}
      COS_BUCKET: ${COS_BUCKET:-huajing-1437302460}
      COS_REGION: ${COS_REGION:-ap-guangzhou}
      COS_ENDPOINT: ${COS_ENDPOINT:-https://huajing-1437302460.cos.ap-guangzhou.myqcloud.com}
      COS_SIGNED_URL_TTL: ${COS_SIGNED_URL_TTL:-3600}
      COS_OBJECT_PREFIX: ${COS_OBJECT_PREFIX:-maolao}
    expose:
      - "8000"
    volumes:
      - maolao_data:/data
    dns:
    - 1.1.1.1
    - 8.8.8.8
    depends_on:
      redis:
        condition: service_healthy

  worker:
    build:
      context: .
      dockerfile: backend/Dockerfile
    command: ["arq", "app.worker.WorkerSettings"]
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATA_DIR: /data
      MAOLAO_BASE_URL: ${MAOLAO_BASE_URL:-https://maolaoapi.com}
      MAOLAO_API_KEY: ${MAOLAO_API_KEY:-}
      MAOLAO_IMAGE_MODEL: ${MAOLAO_IMAGE_MODEL:-gpt-image-2-4k}
      RELAYROUTER_BASE_URL: ${RELAYROUTER_BASE_URL:-https://relayrouter.io/v1}
      RELAYROUTER_API_KEY: ${RELAYROUTER_API_KEY:-}
      RELAYROUTER_IMAGE_MODEL: ${RELAYROUTER_IMAGE_MODEL:-gpt-image-2}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-https://api.openai.com/v1}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_IMAGE_MODEL: ${OPENAI_IMAGE_MODEL:-gpt-image-2}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      COS_ENABLED: ${COS_ENABLED:-false}
      COS_SECRET_ID: ${COS_SECRET_ID:-}
      COS_SECRET_KEY: ${COS_SECRET_KEY:-}
      COS_BUCKET: ${COS_BUCKET:-huajing-1437302460}
      COS_REGION: ${COS_REGION:-ap-guangzhou}
      COS_ENDPOINT: ${COS_ENDPOINT:-https://huajing-1437302460.cos.ap-guangzhou.myqcloud.com}
      COS_SIGNED_URL_TTL: ${COS_SIGNED_URL_TTL:-3600}
      COS_OBJECT_PREFIX: ${COS_OBJECT_PREFIX:-maolao}
    volumes:
      - maolao_data:/data
    depends_on:
      redis:
        condition: service_healthy

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        VITE_API_URL: ""
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "5173:80"

volumes:
  maolao_data:
  maolao_redis:
